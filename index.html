<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yaasir — Apps</title>
<meta name="description" content="Yaasir, Founder & App Builder. Angalia applications zilizotengenezwa, ikiwemo Daladala Navigator.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap');
  :root{
    --bg:#10182B; --bg-soft:#161F38; --teal:#2FE6C4; --blue:#22C1F0;
    --amber:#F4A100; --ink:#F3F5F2; --muted:#8B93A7; --line:rgba(243,245,242,0.09);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased;}
  body::before{content:""; position:fixed; inset:0;
    background:radial-gradient(ellipse 700px 400px at 15% -5%, rgba(47,230,196,0.14), transparent 60%),
    radial-gradient(ellipse 600px 400px at 100% 10%, rgba(34,193,240,0.10), transparent 60%);
    pointer-events:none; z-index:0;}
  .wrap{max-width:720px; margin:0 auto; padding:0 24px; position:relative; z-index:1;}
  header{padding:56px 0 40px; border-bottom:1px solid var(--line);}
  h1{font-family:'Space Grotesk',sans-serif; font-size:clamp(32px,7vw,44px); font-weight:700; letter-spacing:-0.01em; margin-bottom:14px;}
  .role{font-size:14px; font-weight:600; letter-spacing:0.02em; color:var(--teal); margin-top:2px;}
  section{padding:44px 0;}
  .section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:22px;}
  .section-head h2{font-family:'Space Grotesk',sans-serif; font-size:13px; text-transform:uppercase; letter-spacing:0.12em; color:var(--muted); font-weight:700;}
  .count{font-size:13px; color:var(--muted);}
  .app-list{display:flex; flex-direction:column; gap:12px;}
  .app-card{background:var(--bg-soft); border:1px solid var(--line); border-radius:16px; padding:20px;
    display:flex; gap:16px; align-items:flex-start; text-decoration:none; color:inherit;
    transition:border-color .2s ease, transform .2s ease; position:relative; overflow:hidden;}
  .app-card:active{transform:scale(0.99);}
  .app-card.live{border-color:rgba(47,230,196,0.35);}
  .app-icon{width:48px; height:48px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0;}
  .app-card.live .app-icon{background:linear-gradient(135deg, var(--teal), var(--blue));}
  .app-card.soon .app-icon{background:rgba(243,245,242,0.06); border:1px dashed var(--line);}
  .app-body{flex:1; min-width:0;}
  .app-top{display:flex; align-items:center; gap:8px; margin-bottom:4px; flex-wrap:wrap;}
  .app-name{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px;}
  .badge{font-size:10px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; padding:3px 8px; border-radius:20px;}
  .badge.live{background:rgba(47,230,196,0.15); color:var(--teal);}
  .badge.soon{background:rgba(243,245,242,0.08); color:var(--muted);}
  .app-desc{color:var(--muted); font-size:13.5px; line-height:1.5;}
  .app-arrow{color:var(--muted); font-size:18px; flex-shrink:0; margin-top:2px;}
  .app-card.live .app-arrow{color:var(--teal);}
  footer{padding:32px 0 48px; border-top:1px solid var(--line); color:var(--muted); font-size:12.5px; display:flex; flex-direction:column; gap:6px;}
  footer .credit{color:var(--ink); font-weight:600; font-size:13px;}
  footer .credit b{color:var(--teal);}
  footer .meta{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  footer .dot{opacity:0.5;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Yaasir</h1>
    <p class="role">Founder &amp; App Builder</p>
  </header>

  <section>
    <div class="section-head">
      <h2>Applications</h2>
      <span class="count">1 live · zinakuja zaidi</span>
    </div>
    <div class="app-list">
      <a class="app-card live" href="daladala-navigator/">
        <div class="app-icon">🚌</div>
        <div class="app-body">
          <div class="app-top">
            <span class="app-name">Daladala Navigator</span>
            <span class="badge live">Live</span>
          </div>
          <div class="app-desc">Njia, vituo na mwongozo wa daladala — installable kama app kwenye simu yako.</div>
        </div>
        <div class="app-arrow">→</div>
      </a>
    </div>
  </section>

  <footer>
    <div class="credit">Created by <b>Yaasir Developer</b></div>
    <div class="meta">
      <span>📞 0772282160</span>
      <span class="dot">·</span>
      <span>© 2026 Yaasir Developer. Haki zote zimehifadhiwa.</span>
    </div>
  </footer>
</div>
</body>
</html>
